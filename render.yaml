# Render blueprint. Deploy: New → Blueprint → point at this repo.
services:
  - type: web
    name: ap-invoice-workflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/stats
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      # A server has no Claude Code CLI, so extraction goes over HTTP.
      - key: EXTRACTION_PROVIDER
        value: openai_compat

      # --- text path: machine-readable PDFs -----------------------------
      - key: OPENAI_COMPAT_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_COMPAT_MODEL
        value: nvidia/nemotron-3.5-lightning:free

      # --- vision path: scanned pages -----------------------------------
      # Separate because the strongest free text models are text-only, and a
      # scanned invoice cannot be read by a model that does not accept images.
      - key: OPENAI_COMPAT_VISION_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_COMPAT_VISION_MODEL
        value: nex-agi/nex-n2.5-pro:free

      # Set in the dashboard — never committed.
      - key: OPENROUTER_API_KEY
        sync: false
