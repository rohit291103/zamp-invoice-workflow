# Render blueprint. Deploy: New → Blueprint → point at this repo.
services:
  - type: web
    name: ap-invoice-workflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/stats
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      # A server has no Claude Code CLI, so extraction goes over HTTP.
      - key: EXTRACTION_PROVIDER
        value: openai_compat

      # Both paths use one model because it accepts images as well as text,
      # and it is the configuration actually verified against the reference
      # behaviour: 44/44 fields and 11/11 decisions, matching Claude exactly.
      # Re-check with scripts/compare_providers.py before changing either.
      #
      # Rejected alternatives, and why:
      #   google/gemma-4-*:free            vision-capable, but 429 saturated
      #   nvidia/nemotron-3.5-lightning    text-only, so it cannot read a scan
      #   thinkingmachines/inkling-small   403, agentic harnesses only
      - key: OPENAI_COMPAT_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_COMPAT_MODEL
        value: nex-agi/nex-n2.5-pro:free
      - key: OPENAI_COMPAT_VISION_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_COMPAT_VISION_MODEL
        value: nex-agi/nex-n2.5-pro:free

      # Set in the dashboard — never committed.
      - key: OPENROUTER_API_KEY
        sync: false
